name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and test before tagging
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
            echo "latest_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest_exists=true" >> "$GITHUB_OUTPUT"
          fi

          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Bumping ${latest} -> ${next} (${{ inputs.bump }})"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.version.outputs.latest_exists }}" = "true" ]; then
            gh release create "${{ steps.version.outputs.next }}" \
              --title "${{ steps.version.outputs.next }}" \
              --generate-notes \
              --notes-start-tag "${{ steps.version.outputs.latest }}"
          else
            gh release create "${{ steps.version.outputs.next }}" \
              --title "${{ steps.version.outputs.next }}" \
              --generate-notes
          fi
